- id: rule_021
  category: 人设一致性
  content: 从「我」视角叙事时，必须保持人设和数据的一致性。作者人设是成功的独立开发者（副业年入200万、有盈利产品），不是失败者或迷茫者。如需描写失败/迷茫状态，用「朋友」或「以前的我」叙事
  priority: high
  score: 0.75
  confidence: 0.5
  applied_count: 1
  positive_feedback: 1
  negative_feedback: 0
  neutral: 0
  created_at: '2026-01-13T12:00:00'
  last_applied: '2026-01-13T12:00:00'
  parent_rule: rule_005
  child_rules: []
  conditions:
  - 使用第一人称「我」叙事时
  examples:
    good:
    - 用「朋友年薪百万，年度目标年年重来」开头，然后说「两年前的我也这样，后来辞职做独立开发，第一年副业做了200万」
    - 将失败案例放在「朋友」身上，成功经验放在「我」身上
    bad:
    - 「我翻出去年的年度目标，发现和前年一模一样」（与成功独立开发者人设冲突）
    - 用「我」描写反复失败、迷茫的状态
