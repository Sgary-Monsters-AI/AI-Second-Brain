    bad: []
- id: rule_019
  category: 焦虑定位
  content: 焦虑点要聚焦在「我」个人而非泛泛的「大部分人」
  priority: high
  score: 0.65
  confidence: 0.83
  applied_count: 5
  positive_feedback: 4
  negative_feedback: 1
  neutral: 0
  created_at: '2026-01-12T00:00:00'
  last_applied: '2026-01-13T10:08:13.962623'
  parent_rule: null
  child_rules: []
  conditions: []
  examples:
    good:
    - 聚焦在「我会不会被淘汰」而非「大部分人在用旧技能」
    bad:
    - 真正让我焦虑的是大部分人还在用旧技能（和读者无关）
- id: rule_020
  category: 文章类型
  content: 干货类文章（方法论、教程、工具介绍）：方法论和概念阐述优先于众生相，众生相可精简或省略
